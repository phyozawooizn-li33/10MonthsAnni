
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhyoZawOo 💞 Thoon Thit Thit</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pacifico&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0205;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
}

#header-text {
    position: absolute;
    top: 35px;
    width: 100%;
    text-align: center;
    color: white;
    font-family: 'Pacifico', cursive;
    font-size: clamp(19px, 5vw, 28px);
    text-shadow: 0 0 10px #ff1493, 0 0 20px #ff69b4;
    z-index: 10;
}

canvas {
    display: block;
    position: absolute;
    inset: 0;
}

#photo {
    position: absolute;
    width: clamp(125px, 38vw, 190px);
    height: clamp(145px, 43vw, 220px);
    object-fit: cover;
    object-position: center;
    border-radius: 22px;
    border: 3px solid #ff85c0;
    box-shadow:
        0 0 15px #ff1493,
        0 0 35px #ff69b4;
    z-index: 2;
    animation: photoGlow 2s infinite alternate;
}

@keyframes photoGlow {
    from {
        box-shadow: 0 0 12px #ff1493;
    }
    to {
        box-shadow: 0 0 30px #ff69b4, 0 0 45px #ff1493;
    }
}
</style>
</head>

<body>

<div id="header-text">
    PhyoZawOo 💞 Thoon Thit Thit
</div>

<canvas id="heartCanvas"></canvas>

<img
    id="photo"
    src="https://i.postimg.cc/wTCSV2CC/IMG-20260109-204745.jpg"
    alt="Our Memory"
>

<script>
const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d');

let width, height;

const orbitText = "i love u";
const centerName = "Thoon";
const emojis = ["🍓", "🐱", "✨", "🎀", "🍓", "🐾"];

let backgroundElements = [];

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initBackground();
}

function initBackground() {
    backgroundElements = [];

    for (let i = 0; i < 40; i++) {
        backgroundElements.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 20 + 15,
            emoji: emojis[Math.floor(Math.random() * emojis.length)],
            speed: Math.random() * 0.5 + 0.2,
            opacity: Math.random() * 0.5 + 0.3
        });
    }
}

window.addEventListener('resize', resize);
resize();

function getHeartPoint(t) {
    return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t))
    };
}

function animate() {

    ctx.fillStyle = 'rgba(11, 2, 5, 0.2)';
    ctx.fillRect(0, 0, width, height);

    const time = Date.now() * 0.0012;
    const size = Math.min(width, height) / 38;

    // Floating Background
    backgroundElements.forEach(el => {
        ctx.globalAlpha = el.opacity;
        ctx.font = `${el.size}px Arial`;
        ctx.fillText(el.emoji, el.x, el.y);

        el.y -= el.speed;

        if (el.y < -30) {
            el.y = height + 30;
        }
    });

    ctx.globalAlpha = 1;

    // Orbiting Heart Text
    const count = 55;

    ctx.font = "italic 13px Arial";
    ctx.fillStyle = "#ff85c0";

    for (let i = 0; i < count; i++) {

        const t = (i / count) * Math.PI * 2 + time * 0.5;
        const pos = getHeartPoint(t);

        const x = width / 2 + pos.x * size;
        const y = height / 2 + pos.y * size;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(t + Math.PI / 1.5);
        ctx.fillText(orbitText, 0, 0);
        ctx.restore();
    }

    // Center Name Below Photo
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#ff1493";
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.font = "bold 42px 'Dancing Script', cursive";

    const beat = 1 + Math.sin(time * 3) * 0.06;

    ctx.save();
    ctx.translate(
        width / 2,
        height / 2 + Math.min(width, height) * 0.25
    );
    ctx.scale(beat, beat);
    ctx.fillText(centerName, 0, 15);
    ctx.restore();

    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}

document.fonts.ready.then(() => {
    animate();
});
</script>

</body>
</html>
